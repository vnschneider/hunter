services:
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile.web
    container_name: hunter-web
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL?DATABASE_URL is required and must point to the primary database}
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CV_STORAGE_BUCKET: ${CV_STORAGE_BUCKET:-cvs}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    ports:
      - "${WEB_PORT:-3000}:3000"

  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.worker
    container_name: hunter-worker
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL?DATABASE_URL is required and must point to the primary database}
      HUNT_PIPELINE_MODE: ${HUNT_PIPELINE_MODE:-direct_gateway}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-3000}
      WORKER_MAX_BACKOFF_MINUTES: ${WORKER_MAX_BACKOFF_MINUTES:-60}
      MCP_REQUEST_TIMEOUT_MS: ${MCP_REQUEST_TIMEOUT_MS:-120000}
      MCP_INITIALIZE_TIMEOUT_MS: ${MCP_INITIALIZE_TIMEOUT_MS:-20000}
      MCP_TOOL_RETRIES: ${MCP_TOOL_RETRIES:-2}
      MCP_TOOL_RETRY_DELAY_MS: ${MCP_TOOL_RETRY_DELAY_MS:-1200}
      MCP_SCORE_TOOL_RETRIES: ${MCP_SCORE_TOOL_RETRIES:-1}
      MCP_SCORE_REQUEST_TIMEOUT_MS: ${MCP_SCORE_REQUEST_TIMEOUT_MS:-15000}
      MCP_SCORE_CIRCUIT_BREAKER_TIMEOUTS: ${MCP_SCORE_CIRCUIT_BREAKER_TIMEOUTS:-3}
      MCP_RANK_ENABLED: ${MCP_RANK_ENABLED:-0}
      MCP_RANK_TOOL_RETRIES: ${MCP_RANK_TOOL_RETRIES:-0}
      MCP_RANK_REQUEST_TIMEOUT_MS: ${MCP_RANK_REQUEST_TIMEOUT_MS:-8000}
      MCP_SCORE_HTTP_TIMEOUT_MS: ${MCP_SCORE_HTTP_TIMEOUT_MS:-9000}
      MCP_PROVIDER_TIMEOUT_MS: ${MCP_PROVIDER_TIMEOUT_MS:-25000}
      HUNT_MAX_OPENINGS_FROM_SEARCH: ${HUNT_MAX_OPENINGS_FROM_SEARCH:-120}
      HUNT_MAX_OPENINGS_TO_SCORE: ${HUNT_MAX_OPENINGS_TO_SCORE:-20}
      HUNT_SCORE_CONCURRENCY: ${HUNT_SCORE_CONCURRENCY:-3}
      HUNT_SCORE_LLM_TOP_K: ${HUNT_SCORE_LLM_TOP_K:-12}
      HUNT_SCORE_LLM_MIN_HEURISTIC: ${HUNT_SCORE_LLM_MIN_HEURISTIC:-35}
      HUNT_SCORE_PROGRESS_EVERY: ${HUNT_SCORE_PROGRESS_EVERY:-5}
      HUNT_PERSIST_CONCURRENCY: ${HUNT_PERSIST_CONCURRENCY:-4}
      HUNT_SCORE_TIMEOUT_CONTINUE: ${HUNT_SCORE_TIMEOUT_CONTINUE:-1}
      HUNT_AUTO_APPLY_ENABLED: ${HUNT_AUTO_APPLY_ENABLED:-1}
      HUNT_AUTO_APPLY_DRY_RUN: ${HUNT_AUTO_APPLY_DRY_RUN:-0}
      HUNT_AUTO_APPLY_THRESHOLD: ${HUNT_AUTO_APPLY_THRESHOLD:-85}
      HUNT_AUTO_APPLY_MAX_SUBMISSIONS: ${HUNT_AUTO_APPLY_MAX_SUBMISSIONS:-20}
      HUNT_ATS_TAILOR_RESUME_ENABLED: ${HUNT_ATS_TAILOR_RESUME_ENABLED:-1}
      HUNT_ATS_TAILOR_RESUME_MAX_CHARS: ${HUNT_ATS_TAILOR_RESUME_MAX_CHARS:-6000}
      HUNT_AUTO_APPLY_ALLOWED_SOURCES: ${HUNT_AUTO_APPLY_ALLOWED_SOURCES:-nerdin,github}
      AUTO_APPLY_ACCESS_TOKEN: ${AUTO_APPLY_ACCESS_TOKEN:-}
      HUNT_MAX_DURATION_MS: ${HUNT_MAX_DURATION_MS:-900000}
      NOTIFY_INTERESTING_MATCH_SCORE: ${NOTIFY_INTERESTING_MATCH_SCORE:-80}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GREENHOUSE_BOARD_TOKENS: ${GREENHOUSE_BOARD_TOKENS:-}
      LEVER_SITES: ${LEVER_SITES:-}
      LINKEDIN_PAGES: ${LINKEDIN_PAGES:-2}
      NERDIN_PAGES: ${NERDIN_PAGES:-1}
      LINKEDIN_SEARCH_URL: ${LINKEDIN_SEARCH_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      NOTIFY_WEBHOOK_EVENTS: ${NOTIFY_WEBHOOK_EVENTS:-hunt_completed,hunt_failed,hunt_warning}
      NOTIFY_RESEND_API_KEY: ${NOTIFY_RESEND_API_KEY:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
